name: Dokumentasjon

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Ingen skrivetilgang i bygg eller PR-kontroll.
permissions:
  contents: read

jobs:
  build:
    name: Kontroller og bygg
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Hent kildefiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Klargjør Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Installer dokumentasjonsverktøy
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Kontroller katalog og interne lenker
        run: python scripts/check_catalog.py

      - name: Bygg nettstedet med streng validering
        run: python -m mkdocs build --strict

      - name: Last opp nettsted for publisering
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publiser til GitHub Pages
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      # Velg først Settings > Pages > Source > GitHub Actions i repoet.
      - name: Klargjør Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Publiser det kontrollerte nettstedet
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
