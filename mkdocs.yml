site_name: AI in the SDLC
site_description: A catalog of 256 practical AI opportunities across the software delivery learning loop.
site_url: https://grove.github.io/ai-sdlc/
repo_url: https://github.com/grove/ai-sdlc
repo_name: GitHub
edit_uri: edit/main/docs/

theme:
  name: mkdocs
  locale: en
  color_mode: auto
  user_color_mode_toggle: true
  nav_style: dark
  highlightjs: false

plugins:
  - search:
      lang: ['en']
      min_search_length: 2

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - admonition

extra_css:
  - assets/stylesheets/catalog.css

nav:
  - Home: index.md
  - Learning Loop:
      - Problem: stages/problem.md
      - Hypothesis: stages/hypothesis.md
      - Context: stages/context.md
      - Agent Execution: stages/agent-execution.md
      - Verification: stages/verification.md
      - Production: stages/production.md
      - Observation: stages/observation.md
      - Learning: stages/learning.md
  - Using the Catalog:
      - How to Use: guides/how-to-use.md
      - Find by Need: guides/find-by-need.md
      - Measure Impact: guides/impact-measurement.md
      - Worked Examples: workflows.md
      - Project Profiles: project-profiles.md
      - Templates: templates.md
  - Reference:
      - Idea Index: idea-index.md
      - Glossary: glossary.md
      - Sources: sources.md
  - Maintenance: maintenance.md

# Individual idea pages are reachable through stages, the index, links, and search.
not_in_nav: |
  /ideas/*.md

# Strict builds fail on link and navigation problems.
validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
