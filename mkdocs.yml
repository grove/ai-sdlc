site_name: KI i SDLC
site_description: En mulighetskatalog med 256 konkrete ideer for KI i hele systemutviklingens læringssløyfe.
site_url: https://grove.github.io/ai-sdlc/
repo_url: https://github.com/grove/ai-sdlc
repo_name: GitHub
edit_uri: edit/main/docs/

theme:
  name: mkdocs
  locale: nb
  color_mode: auto
  user_color_mode_toggle: true
  nav_style: dark
  highlightjs: false

plugins:
  - search:
      # Engelsk tegnsett bevarer sifrene i ID-er som P01; norsk beholder ordstammer.
      lang: ['no', 'en']
      min_search_length: 2

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - admonition

extra_css:
  - assets/stylesheets/catalog.css

nav:
  - Start: index.md
  - Læringssløyfen:
      - Problem: steg/problem.md
      - Hypotese: steg/hypotese.md
      - Kontekst: steg/kontekst.md
      - Agentutførelse: steg/agentutforelse.md
      - Verifisering: steg/verifisering.md
      - Produksjon: steg/produksjon.md
      - Observasjon: steg/observasjon.md
      - Læring: steg/laering.md
  - Bruk katalogen:
      - Leserveiledning: veiledning/leserveiledning.md
      - Velg etter behov: veiledning/behov.md
      - Mål effekten: veiledning/effektmaaling.md
      - Arbeidsløp: arbeidslop.md
      - Prosjektprofiler: prosjektprofiler.md
      - Maler: maler.md
  - Oppslag:
      - Idéregister: register.md
      - Begreper: begreper.md
      - Kilder: kilder.md
  - Forvaltning: forvaltning.md

# Idésidene nås fra steg, register, andre ideer og søk, uten en meny med 256 valg.
not_in_nav: |
  /ideer/*.md

# Avvik stopper «mkdocs build --strict», også brutte interne ankerlenker.
validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
